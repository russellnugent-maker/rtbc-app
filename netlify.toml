[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The web app is a single-page app under /app
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Universal links / App Links (phase 5). Apple's file has no extension, so Netlify would serve it
# as application/octet-stream; iOS wants JSON. Both must be served as themselves at these exact
# paths, never redirected. assetlinks.json holds the Play app signing key fingerprint.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
